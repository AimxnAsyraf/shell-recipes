name: CI

# Cloudflare Pages builds and deploys the site itself (Git integration).
# This workflow only checks that recipes are valid and the site builds.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check:recipes
      - run: npm run build
